<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Industrial Robot Simulator v3.0</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        /* --- UI Styling: Dark Sci-Fi Theme --- */
        body { margin: 0; overflow: hidden; background-color: #111; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #eee; }
        
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        /* General Panel Style */
        .panel {
            position: absolute;
            background: rgba(16, 24, 32, 0.85); /* Deep Blue-Black */
            backdrop-filter: blur(8px);
            border: 1px solid #334455;
            border-left: 4px solid #00ddee; /* Cyan Accent */
            border-radius: 4px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            transition: opacity 0.3s;
        }

        h3 { margin: 0 0 12px 0; font-size: 13px; text-transform: uppercase; color: #00ddee; letter-spacing: 1.5px; border-bottom: 1px solid #334455; padding-bottom: 5px; }
        
        /* Left Control Panel */
        #controls { top: 20px; left: 20px; width: 260px; }
        
        label { font-size: 11px; color: #aaa; display: block; margin-top: 12px; letter-spacing: 0.5px; }
        .value-display { float: right; color: #fff; font-weight: bold; font-family: 'Consolas', monospace; }

        /* Custom Sliders */
        input[type=range] {
            width: 100%; margin: 6px 0; -webkit-appearance: none; background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 14px; width: 14px; border-radius: 2px; background: #00ddee; cursor: pointer; margin-top: -5px; box-shadow: 0 0 5px #00ddee;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #334455; border-radius: 2px;
        }

        /* Task Space Display */
        .xyz-container {
            display: flex; justify-content: space-between; 
            font-family: 'Consolas', monospace; font-size: 14px; 
            margin-top: 15px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px;
        }
        .coord-label { color: #8899aa; font-size: 10px; margin-right: 4px; }

        /* Right Data Panel */
        #data-panel { top: 20px; right: 20px; width: 320px; height: 220px; }

        /* Buttons */
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn {
            flex: 1; border: none; padding: 8px; border-radius: 3px; 
            cursor: pointer; font-weight: bold; font-size: 12px; text-transform: uppercase;
            transition: all 0.2s; color: #000;
        }
        .btn-reset { background: #445566; color: #fff; }
        .btn-auto { background: #ffaa00; } /* Orange */
        .btn:hover { filter: brightness(1.2); }
        .btn:active { transform: scale(0.98); }

        /* Indicators */
        #status-indicator {
            position: absolute; bottom: 20px; left: 20px; 
            font-size: 11px; color: #666; font-family: monospace;
        }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #00ff00; margin-right: 5px; }
        .mode-manual { background: #00ddee; }
        .mode-auto { background: #ffaa00; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="controls" class="panel">
        <h3>Joint Controls</h3>
        
        <label>Base (J1) <span id="val1" class="value-display">0°</span></label>
        <input type="range" id="in1" min="-180" max="180" value="0">

        <label>Shoulder (J2) <span id="val2" class="value-display">0°</span></label>
        <input type="range" id="in2" min="-45" max="90" value="0"> <label>Elbow (J3) <span id="val3" class="value-display">0°</span></label>
        <input type="range" id="in3" min="-90" max="90" value="0">

        <label style="margin-top: 20px; border-top: 1px solid #334455; padding-top: 10px;">End-Effector Coordinates (FK)</label>
        <div class="xyz-container">
            <span style="color: #ff6666"><span class="coord-label">X</span><span id="posX">0.00</span></span>
            <span style="color: #66ff66"><span class="coord-label">Y</span><span id="posY">0.00</span></span>
            <span style="color: #6688ff"><span class="coord-label">Z</span><span id="posZ">0.00</span></span>
        </div>

        <div class="btn-group">
            <button class="btn btn-reset" onclick="resetSim()">Reset</button>
            <button class="btn btn-auto" onclick="toggleAutomation()">▶ Pick & Place</button>
        </div>
    </div>

    <div id="data-panel" class="panel">
        <h3>Angular Velocity (Shoulder)</h3>
        <canvas id="velocityChart"></canvas>
    </div>

    <div id="status-indicator">
        <span id="mode-dot" class="status-dot mode-manual"></span>
        STATUS: <span id="status-text">MANUAL CONTROL ACTIVE</span>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const CONFIG = {
            colors: {
                bg: 0x15151e,
                grid: 0x333333,
                base: 0x222222,
                link: 0xe0e0e0,
                joint: 0x333333,
                accent: 0xffaa00,
                box: 0xff4444
            },
            smoothness: 0.12, // 動きの遅れ係数 (少し速く)
            autoSpeed: 2,     // 自動再生時の待機時間倍率
            // ロボットアームのリンク長（実際の3Dモデルに合わせる）
            robot: {
                baseHeight: 0.4,      // ベースの高さ
                link1Height: 1.8,     // Joint1からJoint2までの高さ
                link2Length: 1.8,     // Link2の長さ（Joint2からJoint3）
                link3Length: 0.7,     // Link3の長さ（Joint3からハンド）
                gripperLength: 0.5    // グリッパーの長さ
            }
        };

        // --- 2. THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(CONFIG.colors.bg);
        scene.fog = new THREE.Fog(CONFIG.colors.bg, 10, 40);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 5, 6);
        camera.lookAt(0, 1.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // Environment
        const grid = new THREE.GridHelper(20, 20, 0x555555, 0x222222);
        scene.add(grid);
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshPhongMaterial({ color: 0x111111, depthWrite: false });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // --- 3. ROBOT CONSTRUCTION ---
        const robotGroup = new THREE.Group();
        scene.add(robotGroup);

        // Reusable Materials
        const matBase = new THREE.MeshPhongMaterial({ color: CONFIG.colors.base });
        const matLink = new THREE.MeshPhongMaterial({ color: CONFIG.colors.link, shininess: 80 });
        const matJoint = new THREE.MeshStandardMaterial({ color: CONFIG.colors.joint, roughness: 0.6 });
        const matAccent = new THREE.MeshBasicMaterial({ color: CONFIG.colors.accent });

        // -- Base --
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.0, 0.4, 32), matBase);
        base.position.y = 0.2;
        base.receiveShadow = true;
        base.castShadow = true;
        robotGroup.add(base);

        // -- Joint 1 (Yaw) --
        const joint1 = new THREE.Group();
        joint1.position.y = 0.4;
        robotGroup.add(joint1);

        // J1 Visuals
        const j1Mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.4, 32), matJoint);
        j1Mesh.position.y = 0.2;
        j1Mesh.castShadow = true;
        joint1.add(j1Mesh);
        const link1 = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.2, 0.5), matLink);
        link1.position.y = 1.0;
        link1.castShadow = true;
        joint1.add(link1);

        // -- Joint 2 (Pitch) --
        const joint2 = new THREE.Group();
        joint2.position.y = 1.8; // Top of Link 1
        joint1.add(joint2);

        // J2 Visuals
        const j2Axis = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.7, 32), matJoint);
        j2Axis.rotation.z = Math.PI / 2;
        j2Axis.castShadow = true;
        joint2.add(j2Axis);
        const link2 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.6, 0.4), matLink);
        link2.position.y = 1.0; // Extend upwards
        link2.castShadow = true;
        joint2.add(link2);

        // -- Joint 3 (Pitch/Elbow) --
        const joint3 = new THREE.Group();
        joint3.position.y = 1.8; // Top of Link 2
        joint2.add(joint3);

        // J3 Visuals
        const j3Axis = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.6, 32), matJoint);
        j3Axis.rotation.z = Math.PI / 2;
        j3Axis.castShadow = true;
        joint3.add(j3Axis);
        const link3 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.6, 0.3), matLink);
        link3.position.y = 0.4;
        link3.castShadow = true;
        joint3.add(link3);

        // -- End Effector (Hand) --
        const handGroup = new THREE.Group();
        handGroup.position.y = 0.7;
        joint3.add(handGroup);

        const handBase = new THREE.Mesh(new THREE.SphereGeometry(0.2), matAccent);
        handGroup.add(handBase);

        // Gripper fingers (保存して後でアニメーション)
        const fingerLeft = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.35, 0.08), matJoint);
        fingerLeft.position.set(0.2, 0.25, 0);
        handGroup.add(fingerLeft);
        const fingerRight = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.35, 0.08), matJoint);
        fingerRight.position.set(-0.2, 0.25, 0);
        handGroup.add(fingerRight);

        // グリッパーの開閉状態 (0=開, 1=閉)
        let gripperState = 0;
        let gripperTarget = 0;
        const GRIPPER_OPEN_POS = 0.2;
        const GRIPPER_CLOSED_POS = 0.1;

        // --- 4. OBJECTS & TRAJECTORY ---

        // ボックスの設定 (ロボットの到達範囲内に配置)
        const BOX_SIZE = 0.3;
        const BOX_INITIAL_POS = new THREE.Vector3(1.5, BOX_SIZE / 2, 1.0);
        const DROP_TARGET_POS = new THREE.Vector3(-1.2, BOX_SIZE / 2, 1.0);

        // Target Box
        const boxGeo = new THREE.BoxGeometry(BOX_SIZE, BOX_SIZE, BOX_SIZE);
        const boxMat = new THREE.MeshPhongMaterial({ color: CONFIG.colors.box });
        const targetBox = new THREE.Mesh(boxGeo, boxMat);
        targetBox.position.copy(BOX_INITIAL_POS);
        targetBox.castShadow = true;
        scene.add(targetBox);

        // 掴み状態の追跡
        let isGrabbing = false;
        let grabOffset = new THREE.Vector3();

        // ピックアップ位置のマーカー（緑のプレート）
        const pickupPlatform = new THREE.Mesh(
            new THREE.CylinderGeometry(0.5, 0.5, 0.05, 32),
            new THREE.MeshPhongMaterial({ color: 0x22aa44, transparent: true, opacity: 0.6 })
        );
        pickupPlatform.position.set(BOX_INITIAL_POS.x, 0.025, BOX_INITIAL_POS.z);
        pickupPlatform.receiveShadow = true;
        scene.add(pickupPlatform);

        // ドロップターゲットの台（オレンジのプレート）
        const dropPlatform = new THREE.Mesh(
            new THREE.CylinderGeometry(0.5, 0.5, 0.05, 32),
            new THREE.MeshPhongMaterial({ color: 0xff8800, transparent: true, opacity: 0.6 })
        );
        dropPlatform.position.set(DROP_TARGET_POS.x, 0.025, DROP_TARGET_POS.z);
        dropPlatform.receiveShadow = true;
        scene.add(dropPlatform);

        // Trajectory Line
        const maxPoints = 300;
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ddee, linewidth: 2 });
        const lineGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(maxPoints * 3);
        lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const trailLine = new THREE.Line(lineGeo, lineMat);
        scene.add(trailLine);

        // --- 5. KINEMATICS & AUTOMATION LOGIC ---

        // 逆運動学 (IK) - 目標位置から各関節角度を計算
        function calculateIK(targetPos, heightOffset = 0) {
            const R = CONFIG.robot;
            // ベースからの相対位置
            const x = targetPos.x;
            const z = targetPos.z;
            const y = targetPos.y + heightOffset;

            // Joint1 (ベースの回転) - XZ平面での角度
            const j1 = Math.atan2(x, z) * (180 / Math.PI);

            // 水平距離
            const horizontalDist = Math.sqrt(x * x + z * z);

            // Joint2の高さ（ベースから）
            const baseToJ2Height = R.baseHeight + R.link1Height; // 0.4 + 1.8 = 2.2
            const L2 = R.link2Length;  // 1.8
            const L3 = R.link3Length + R.gripperLength; // 0.7 + 0.5 = 1.2

            // ターゲットからJoint2への相対ベクトル
            const relativeY = y - baseToJ2Height;
            const reachDist = Math.sqrt(horizontalDist * horizontalDist + relativeY * relativeY);

            let j2, j3;

            // 腕が届く範囲をチェック
            const maxReach = L2 + L3;
            const minReach = Math.abs(L2 - L3);

            if (reachDist >= maxReach) {
                // 届かない - 腕を完全に伸ばす
                const targetAngle = Math.atan2(relativeY, horizontalDist);
                j2 = (Math.PI / 2 - targetAngle) * (180 / Math.PI);
                j3 = 0;
            } else if (reachDist <= minReach) {
                // 近すぎる - 肘を曲げる
                j2 = 45;
                j3 = 90;
            } else {
                // 余弦定理で角度計算 (2リンクロボットアームのIK)
                // 肘の角度 (j3)
                const cosElbow = (L2 * L2 + L3 * L3 - reachDist * reachDist) / (2 * L2 * L3);
                const elbowAngle = Math.acos(Math.max(-1, Math.min(1, cosElbow)));
                j3 = (Math.PI - elbowAngle) * (180 / Math.PI);

                // 肩の角度 (j2)
                const cosShoulder = (L2 * L2 + reachDist * reachDist - L3 * L3) / (2 * L2 * reachDist);
                const shoulderAngle = Math.acos(Math.max(-1, Math.min(1, cosShoulder)));
                const targetAngle = Math.atan2(relativeY, horizontalDist);

                // j2は垂直からの角度
                j2 = (shoulderAngle - targetAngle) * (180 / Math.PI);
            }

            // 関節の制限を適用
            j2 = Math.max(-45, Math.min(90, j2));
            j3 = Math.max(-90, Math.min(90, j3));

            return { j1, j2, j3 };
        }

        // 順運動学 (FK) - 現在の関節角度からエンドエフェクタ位置を計算
        function calculateFK(j1Deg, j2Deg, j3Deg) {
            const R = CONFIG.robot;
            const j1 = j1Deg * (Math.PI / 180);
            const j2 = j2Deg * (Math.PI / 180);
            const j3 = j3Deg * (Math.PI / 180);

            const baseToJ2Height = R.baseHeight + R.link1Height;
            const L2 = R.link2Length;
            const L3 = R.link3Length + R.gripperLength;

            // Link2の先端位置
            const l2X = L2 * Math.sin(j2);
            const l2Y = L2 * Math.cos(j2);

            // Link3の先端位置（Link2からの相対）
            const totalAngle = j2 + j3;
            const l3X = L3 * Math.sin(totalAngle);
            const l3Y = L3 * Math.cos(totalAngle);

            // 合計の水平・垂直距離
            const horizontalDist = l2X + l3X;
            const verticalDist = baseToJ2Height + l2Y + l3Y;

            // XZ平面での座標
            const x = horizontalDist * Math.sin(j1);
            const z = horizontalDist * Math.cos(j1);
            const y = verticalDist;

            return new THREE.Vector3(x, y, z);
        }

        let isAutomating = false;
        let automationStep = 0;
        let stepTimer = 0;
        let sequence = [];

        // シーケンスを動的に生成
        function generateSequence() {
            const pickPos = BOX_INITIAL_POS.clone();
            pickPos.y = BOX_SIZE + 0.1; // ボックスの上面 + マージン

            const approachPick = pickPos.clone();
            approachPick.y += 0.5; // 上からアプローチ

            const dropPos = DROP_TARGET_POS.clone();
            dropPos.y = BOX_SIZE + 0.1;

            const approachDrop = dropPos.clone();
            approachDrop.y += 0.5;

            const liftPos = pickPos.clone();
            liftPos.y += 0.8;

            const homeAngles = { j1: 0, j2: 0, j3: 0 };
            const approachPickAngles = calculateIK(approachPick);
            const pickAngles = calculateIK(pickPos);
            const liftAngles = calculateIK(liftPos);
            const approachDropAngles = calculateIK(approachDrop);
            const dropAngles = calculateIK(dropPos);

            return [
                { a: [homeAngles.j1, homeAngles.j2, homeAngles.j3], w: 30, type: 'open' },
                { a: [approachPickAngles.j1, approachPickAngles.j2, approachPickAngles.j3], w: 20, type: 'move' },
                { a: [pickAngles.j1, pickAngles.j2, pickAngles.j3], w: 30, type: 'move' },
                { a: [pickAngles.j1, pickAngles.j2, pickAngles.j3], w: 40, type: 'grab' },
                { a: [liftAngles.j1, liftAngles.j2, liftAngles.j3], w: 30, type: 'move' },
                { a: [approachDropAngles.j1, approachDropAngles.j2, approachDropAngles.j3], w: 30, type: 'move' },
                { a: [dropAngles.j1, dropAngles.j2, dropAngles.j3], w: 30, type: 'move' },
                { a: [dropAngles.j1, dropAngles.j2, dropAngles.j3], w: 40, type: 'drop' },
                { a: [approachDropAngles.j1, approachDropAngles.j2, approachDropAngles.j3], w: 20, type: 'move' },
                { a: [homeAngles.j1, homeAngles.j2, homeAngles.j3], w: 0, type: 'finish' }
            ];
        }

        function updateGripper() {
            // グリッパーの開閉をスムーズにアニメーション
            gripperState += (gripperTarget - gripperState) * 0.15;

            const pos = THREE.MathUtils.lerp(GRIPPER_OPEN_POS, GRIPPER_CLOSED_POS, gripperState);
            fingerLeft.position.x = pos;
            fingerRight.position.x = -pos;
        }

        function openGripper() {
            gripperTarget = 0;
        }

        function closeGripper() {
            gripperTarget = 1;
        }

        function grabBox() {
            if (isGrabbing) return;

            closeGripper();
            isGrabbing = true;

            // ボックスをハンドにアタッチ (ワールド座標を保持)
            handGroup.attach(targetBox);

            // ボックスをグリッパーの指の間に正確に配置
            // 指の長さ (0.35) の中央付近にボックスを配置
            targetBox.position.set(0, 0.15 + BOX_SIZE / 2, 0);
            targetBox.rotation.set(0, 0, 0);
        }

        function dropBox() {
            if (!isGrabbing) {
                // 初期リセット時
                targetBox.position.copy(BOX_INITIAL_POS);
                targetBox.rotation.set(0, 0, 0);
                return;
            }

            openGripper();

            // ボックスのワールド位置を取得してからシーンに戻す
            const worldPos = new THREE.Vector3();
            targetBox.getWorldPosition(worldPos);

            scene.attach(targetBox);

            // 床の高さに正確に配置
            targetBox.position.x = worldPos.x;
            targetBox.position.y = BOX_SIZE / 2;
            targetBox.position.z = worldPos.z;
            targetBox.rotation.set(0, 0, 0);

            isGrabbing = false;
        }

        function toggleAutomation() {
            if (isAutomating) return;

            // 状態リセット
            if (isGrabbing) {
                scene.attach(targetBox);
                isGrabbing = false;
            }
            targetBox.position.copy(BOX_INITIAL_POS);
            targetBox.rotation.set(0, 0, 0);
            openGripper();

            // シーケンス生成
            sequence = generateSequence();

            isAutomating = true;
            automationStep = 0;
            stepTimer = 0;

            updateStatus(true);
        }

        // --- 6. CHART.JS SETUP ---
        const ctx = document.getElementById('velocityChart').getContext('2d');
        const vChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(40).fill(''),
                datasets: [{
                    data: Array(40).fill(0),
                    borderColor: '#00ddee',
                    borderWidth: 1.5,
                    backgroundColor: 'rgba(0, 221, 238, 0.1)',
                    fill: 'start',
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { min: -3, max: 3, grid: { color: '#334455' } },
                    x: { display: false }
                }
            }
        });

        // --- 7. MAIN LOOP & CONTROL ---
        const ui = {
            in1: document.getElementById('in1'),
            in2: document.getElementById('in2'),
            in3: document.getElementById('in3'),
            val1: document.getElementById('val1'),
            val2: document.getElementById('val2'),
            val3: document.getElementById('val3'),
            x: document.getElementById('posX'),
            y: document.getElementById('posY'),
            z: document.getElementById('posZ'),
            status: document.getElementById('status-text'),
            dot: document.getElementById('mode-dot')
        };

        // Current state for Lerp
        let cur = { j1: 0, j2: 0, j3: 0 };
        let prevJ2 = 0; // For velocity calc
        const tempVec = new THREE.Vector3();

        function updateStatus(auto) {
            if(auto) {
                ui.status.textContent = "AUTOMATION SEQUENCE RUNNING...";
                ui.dot.className = "status-dot mode-auto";
            } else {
                ui.status.textContent = "MANUAL CONTROL ACTIVE";
                ui.dot.className = "status-dot mode-manual";
            }
        }

        function resetSim() {
            isAutomating = false;

            // 掴み状態をリセット
            if (isGrabbing) {
                scene.attach(targetBox);
                isGrabbing = false;
            }

            // 関節をリセット
            ui.in1.value = 0;
            ui.in2.value = 0;
            ui.in3.value = 0;
            cur.j1 = 0;
            cur.j2 = 0;
            cur.j3 = 0;

            // ボックス位置をリセット
            targetBox.position.copy(BOX_INITIAL_POS);
            targetBox.rotation.set(0, 0, 0);

            // グリッパーを開く
            openGripper();

            // 軌跡をリセット
            positions.fill(0);
            lineGeo.attributes.position.needsUpdate = true;

            updateStatus(false);
        }

        function updateTrail() {
            handGroup.getWorldPosition(tempVec);
            
            // Shift array
            for (let i = 0; i < maxPoints - 1; i++) {
                positions[i * 3] = positions[(i + 1) * 3];
                positions[i * 3 + 1] = positions[(i + 1) * 3 + 1];
                positions[i * 3 + 2] = positions[(i + 1) * 3 + 2];
            }
            // Add new
            positions[(maxPoints - 1) * 3] = tempVec.x;
            positions[(maxPoints - 1) * 3 + 1] = tempVec.y;
            positions[(maxPoints - 1) * 3 + 2] = tempVec.z;
            
            lineGeo.attributes.position.needsUpdate = true;
            
            // UI XYZ Update
            ui.x.textContent = tempVec.x.toFixed(2);
            ui.y.textContent = tempVec.y.toFixed(2);
            ui.z.textContent = tempVec.z.toFixed(2);
        }

        function animate() {
            requestAnimationFrame(animate);

            let t1, t2, t3; // Targets

            if (isAutomating && sequence.length > 0) {
                const step = sequence[automationStep];
                t1 = step.a[0];
                t2 = step.a[1];
                t3 = step.a[2];

                // 目標角度への距離をチェック
                const d1 = Math.abs(cur.j1 - t1);
                const d2 = Math.abs(cur.j2 - t2);
                const d3 = Math.abs(cur.j3 - t3);

                // 目標に十分近づいたら
                if (d1 < 1.0 && d2 < 1.0 && d3 < 1.0) {
                    stepTimer++;
                    if (stepTimer > step.w) {
                        // アクション実行
                        switch (step.type) {
                            case 'open':
                                openGripper();
                                break;
                            case 'grab':
                                grabBox();
                                break;
                            case 'drop':
                                dropBox();
                                break;
                            case 'finish':
                                isAutomating = false;
                                break;
                        }

                        if (isAutomating && automationStep < sequence.length - 1) {
                            automationStep++;
                        }
                        stepTimer = 0;
                    }
                }

                // スライダーを自動移動に同期
                ui.in1.value = Math.round(cur.j1);
                ui.in2.value = Math.round(cur.j2);
                ui.in3.value = Math.round(cur.j3);

                if (!isAutomating) updateStatus(false);

            } else {
                // マニュアルモード
                t1 = parseFloat(ui.in1.value);
                t2 = parseFloat(ui.in2.value);
                t3 = parseFloat(ui.in3.value);
            }

            // 物理: スムージング (Lerp)
            cur.j1 += (t1 - cur.j1) * CONFIG.smoothness;
            cur.j2 += (t2 - cur.j2) * CONFIG.smoothness;
            cur.j3 += (t3 - cur.j3) * CONFIG.smoothness;

            // 回転を適用 (Deg -> Rad)
            joint1.rotation.y = THREE.MathUtils.degToRad(-cur.j1);
            joint2.rotation.z = THREE.MathUtils.degToRad(cur.j2);
            joint3.rotation.z = THREE.MathUtils.degToRad(cur.j3);

            // グリッパーのアニメーション更新
            updateGripper();

            // UI テキスト更新
            ui.val1.textContent = Math.round(cur.j1) + "°";
            ui.val2.textContent = Math.round(cur.j2) + "°";
            ui.val3.textContent = Math.round(cur.j3) + "°";

            // チャート更新
            const velocity = (cur.j2 - prevJ2);
            prevJ2 = cur.j2;
            const cData = vChart.data.datasets[0].data;
            cData.shift();
            cData.push(velocity * 2);
            vChart.update('none');

            updateTrail();
            renderer.render(scene, camera);
        }

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        animate();

    </script>
</body>
</html>
